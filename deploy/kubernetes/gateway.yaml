apiVersion: apps/v1
kind: Deployment
metadata:
  name: inferencemesh-gateway
  namespace: inferencemesh
  labels:
    app.kubernetes.io/name: inferencemesh
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inferencemesh
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inferencemesh
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: inferencemesh:0.2.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: INFERENCEMESH_ENVIRONMENT
              value: public-demo
            - name: INFERENCEMESH_BACKEND_MODE
              value: demo
            - name: INFERENCEMESH_REQUIRE_API_KEY
              value: "true"
            - name: INFERENCEMESH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: inferencemesh-gateway
                  key: api-key
            - name: INFERENCEMESH_METRICS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: inferencemesh-gateway
                  key: metrics-key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: inferencemesh-gateway
  namespace: inferencemesh
spec:
  selector:
    app.kubernetes.io/name: inferencemesh
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inferencemesh-gateway
  namespace: inferencemesh
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: inferencemesh
      app.kubernetes.io/component: gateway
