apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-default-deny
  namespace: inferencemesh
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-allow-ingress
  namespace: inferencemesh
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: gateway
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
