[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "inferencemesh"
version = "0.1.0"
description = "An SLO-aware, OpenAI-compatible inference control plane."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Prithiraj" }]
dependencies = [
  "fastapi>=0.116,<1",
  "prometheus-client>=0.22,<1",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
inferencemesh = "inferencemesh.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/inferencemesh"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/inferencemesh/api.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["inferencemesh"]
