# Optional deployment definition; no cloud resources are provisioned by this repository.
services:
  - type: web
    name: inferencemesh-gateway
    runtime: docker
    plan: free
    healthCheckPath: /health/ready
    envVars:
      - key: INFERENCEMESH_ENVIRONMENT
        value: public-demo
      - key: INFERENCEMESH_BACKEND_MODE
        value: demo
      - key: INFERENCEMESH_REQUIRE_API_KEY
        value: "true"
      - key: INFERENCEMESH_API_KEY
        generateValue: true
      - key: INFERENCEMESH_METRICS_API_KEY
        generateValue: true
      - key: INFERENCEMESH_MAX_CONCURRENT_REQUESTS
        value: "8"
      - key: INFERENCEMESH_MAX_CONCURRENT_PER_TENANT
        value: "2"
      - key: INFERENCEMESH_MAX_QUEUE_DEPTH
        value: "16"
      - key: INFERENCEMESH_MAX_OUTPUT_TOKENS
        value: "128"
      - key: INFERENCEMESH_REQUESTS_PER_MINUTE
        value: "30"
      - key: INFERENCEMESH_OUTPUT_TOKENS_PER_MINUTE
        value: "2048"
